{% extends 'global/base.html' %} 

{% block content %}
<h1>Fiche produit</h1>
<p>Bienvenue {{user_name|upper}}</p>
<h2>{{product.name}}</h2>

<img src="{{product.image_url}}" width="250" alt="Image de {{product.name}}" />

<p>{{product.description}}</p>

<ul>
  <li>Prix : {{product.price}}</li>
</ul>
{% endblock %}
